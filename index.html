function allHeads(){
  var seen = {}, out = [];
  db.entries.forEach(function(e){
    (e.tags||[]).forEach(function(t){
      var k = String(t).toLowerCase();
      if (!seen[k]){ seen[k] = 1; out.push(t); }
    });
  });
  return out.sort();
}

function entryForm(existing, kind){
  var k = kind || (existing ? kindOf(existing) : "passage");
  var K = KINDS[k];
  var e = existing || {text:"",title:"",author:"",work:"",ref:"",note:"",tags:[]};
  var fields = K.fields.map(function(f){
    var lab = (K.labels && K.labels[f]) || FIELD_DEFAULTS[f].lab;
    var ph  = (K.ph && K.ph[f]) || "";
    var val = esc(e[f] || "");
    if (FIELD_DEFAULTS[f].el === "textarea"){
      var tid = "f_"+f;
      return '<label><span class="lab">'+lab+'</span>'+
             fmtBar(tid)+
             '<textarea id="'+tid+'" placeholder="'+esc(ph)+'">'+val+'</textarea></label>';
    }
    var hint = FIELD_HINTS[f] ? '<span class="hint">'+FIELD_HINTS[f]+'</span>' : '';
    return '<label><span class="lab">'+lab+'</span>'+
           '<input type="text" id="f_'+f+'" value="'+val+'" placeholder="'+esc(ph)+'">'+hint+'</label>';
  });
  /* pair up the short fields two to a row */
  var html = "", i = 0;
  while (i < fields.length){
    var isTextarea = fields[i].indexOf("<textarea") !== -1;
    if (isTextarea){ html += fields[i]; i++; continue; }
    var next = fields[i+1];
    if (next && next.indexOf("<textarea") === -1){
      html += '<div class="row">'+fields[i]+next+'</div>'; i += 2;
    } else { html += fields[i]; i++; }
  }
  var nbOptions = db.notebooks.map(function(n){
    var sel = (existing ? existing.nbId : ui.nbId) === n.id ? " selected" : "";
    return '<option value="'+n.id+'"'+sel+'>'+esc(n.title + (n.author ? " — " + n.author : ""))+'</option>';
  }).join("");
  var here = nb(existing ? existing.nbId : ui.nbId) || db.notebooks[0];
  var fromLine = here
    ? 'From <em>'+esc(here.title)+'</em>'+(here.author ? ", "+esc(here.author) : "")+' — set on the notebook, so only the page is wanted here.'
    : K.blurb;
  /* Inside a notebook you keep a passage or a reflection. An entry that is
     already something else keeps its own kind in the list, so nothing is trapped. */
  var offered = NEW_KINDS.slice();
  if (offered.indexOf(k) === -1) offered.push(k);
  var kindOptions = KIND_ORDER.filter(function(kk){ return offered.indexOf(kk) !== -1; })
    .map(function(kk){
      return '<option value="'+kk+'"'+(kk===k?" selected":"")+'>'+KINDS[kk].label+'</option>';
    }).join("");
  var heads = allHeads().map(function(t){ return '<option value="'+esc(t)+'">'; }).join("");

  document.getElementById("modal").innerHTML =
    '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">'+
    '<div class="fleuron" style="text-align:center">'+K.glyph+'</div>'+
    '<h2>'+(existing ? "Edit this entry" : K.label)+'</h2>'+
    '<p class="hint lede">'+fromLine+'</p>'+
    html +
    '<div class="row">'+
      '<label><span class="lab">KIND</span><select id="f_kind" data-act="switchkind">'+kindOptions+'</select></label>'+
      '<label><span class="lab">FROM WHICH WORK</span><select id="f_nb" data-act="switchnb">'+nbOptions+'</select></label>'+
    '</div>'+
    '<label><span class="lab">HEADS</span>'+
      '<input type="text" id="f_tags" list="headlist" value="'+esc((e.tags||[]).join(", "))+'" placeholder="conscience, papacy, authority">'+
      '<datalist id="headlist">'+heads+'</datalist>'+
      '<span class="hint">Separate with commas. These build your index.</span></label>'+
    '<label><span class="lab">YOUR OWN NOTE (OPTIONAL)</span>'+
      fmtBar("f_note")+
      '<textarea id="f_note" style="min-height:76px" placeholder="Why this is worth keeping…">'+esc(e.note||"")+'</textarea></label>'+
    '<div class="actions"><button class="btn ghost" data-act="close">CANCEL</button>'+
    '<button class="btn primary" data-act="saveentry" data-id="'+(existing?existing.id:"")+'" data-k="'+k+'">SAVE ENTRY</button></div>'+
    '</div></div>';
  setTimeout(function(){
    var first = document.getElementById("f_" + K.fields[0]);
    if (first) first.focus();
  }, 30);
}

    '<div class="actions" style="justify-content:center;margin-top:16px">'+
    '<button class="btn primary" data-act="archive">MAKE AN ARCHIVE</button></div>'+
    '<p class="hint" style="margin-top:14px;text-align:center">An archive is a single HTML file holding both the book and '+
    'the means of reading it. Open it in any browser, on any machine, with nothing else needed. '+
    'It is the copy to keep.</p>'+
    '<div class="actions" style="justify-content:center"><button class="btn ghost" data-act="close">CLOSE</button></div>'+
    '</div></div>';
}

/* ---------- export & import ---------- */
function download(blob, name){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function doExport(){
  download(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),
           "commonplace-book-" + new Date().toISOString().slice(0,10) + ".json");
  flash("EXPORTED");
}
/* One file that is both the book and the means of reading it. */
function doArchive(){
  try {
    var packed = JSON.parse(JSON.stringify(db));
    packed.archivedAt = new Date().toISOString();

    var doc = new DOMParser().parseFromString(TEMPLATE, "text/html");
    if (!doc || !doc.body) throw new Error("template");

    var old = doc.getElementById("cpb-data");   /* never nest one archive inside another */
    if (old) old.remove();

    var tag = doc.createElement("script");
    tag.id = "cpb-data";
    tag.type = "application/json";
    /* the only sequence that could end the tag early */
    tag.textContent = JSON.stringify(packed).replace(/<\/script/gi, "<\\/script");
    /* into the head — the app reads this while it starts up, so it has to be
       parsed before the script below it */
    doc.head.appendChild(tag);

    var out = "<!doctype html>\n" + doc.documentElement.outerHTML;
    download(new Blob([out],{type:"text/html"}),
             "commonplace-book-archive-" + new Date().toISOString().slice(0,10) + ".html");
    flash("ARCHIVED — " + Math.round(out.length/1024) + " KB");
  } catch(err){
    flash("COULD NOT ARCHIVE — EXPORT INSTEAD");
  }
}
document.getElementById("importer").addEventListener("change", function(ev){
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var p = JSON.parse(r.result);
      if (!p || !Array.isArray(p.notebooks) || !Array.isArray(p.entries)) throw new Error("shape");
      if (!confirm("This replaces the "+db.entries.length+" entries now in the book. Continue?")) return;
      db = p; migrate(); applyBackdrop(); save(true); closeModal();
      ui.view = "shelf"; ui.nbId = null; ui.kindFilter = "all"; render(); flash("RESTORED");
    } catch(err){ alert("That file could not be read as a commonplace book export."); }
  };
  r.readAsText(f);
  ev.target.value = "";
});
function copyEntry(e){
  var k = kindOf(e), parts = [];
  if (e.title) parts.push(stripMarks(e.title));
  if (e.text) parts.push(stripMarks(e.text));
  var s = sourceOf(e);
  var att = [s.author, s.work, s.edition, pageLabel(e.page), (k === "definition" ? "" : e.ref)]
              .filter(Boolean).join(", ");
  if (att && (k === "passage" || k === "verse")) parts.push("— " + att);
  else if (att) parts.push("(" + att + ")");
  var txt = parts.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ flash("COPIED"); }, function(){ flash("COPY FAILED"); });
  } else { flash("COPY UNAVAILABLE"); }
}

/* ---------- events ---------- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-act]");
  if (!t) return;
  var a = t.dataset.act;
  if (a === "scrim" && ev.target !== t) return;

  if (a === "go"){ ui.view = t.dataset.view; ui.filter = null; ui.kindFilter = "all"; setQ(""); render(); window.scrollTo(0,0); return; }
  if (a === "open"){ openNotebook(t.dataset.id); return; }
  if (a === "clearq"){ setQ(""); ui.kindFilter = "all"; render(); return; }
  if (a === "close" || a === "scrim"){ closeModal(); return; }
  if (a === "menu"){ menuSheet(); return; }
  if (a === "export"){ doExport(); return; }
  if (a === "archive"){ doArchive(); return; }
  if (a === "dismissnotice"){ noticeGone = true; render(); return; }
  if (a === "import"){ document.getElementById("importer").click(); return; }
  if (a === "newnb"){ notebookForm(null); return; }
  if (a === "renamenb"){ notebookForm(nb(ui.nbId)); return; }
  if (a === "printnb"){ window.print(); return; }

  if (a === "pickcolor"){
    document.querySelectorAll("#f_colors .sw").forEach(function(b){ b.setAttribute("aria-pressed","false"); });
    t.setAttribute("aria-pressed","true");
    document.getElementById("modal").dataset.color = t.dataset.i;
    return;
  }
  if (a === "pickbackdrop"){ var bi = document.getElementById("backdropfile"); if (bi) bi.click(); return; }
  if (a === "clearbackdrop"){
    delete db.backdrop; applyBackdrop(); save(); menuSheet(); flash("BACKDROP REMOVED"); return;
  }
  if (a === "veil"){
    db.veil = t.dataset.v; applyBackdrop(); save(true);
    document.querySelectorAll('[data-act="veil"]').forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.v === db.veil));
    });
    return;
  }
  if (a === "pickcover"){ var ci2 = document.getElementById("coverfile"); if (ci2) ci2.click(); return; }
  if (a === "clearcover"){ pendingCover = null; refreshCoverPrev(); return; }
  if (a === "savenb"){
    var title = document.getElementById("f_title").value.trim();
    if (!title){ document.getElementById("f_title").focus(); flash("GIVE IT A TITLE"); return; }
    var subEl = document.getElementById("f_sub");
    var sub = subEl ? subEl.value.trim() : (t.dataset.id ? (nb(t.dataset.id)||{}).subtitle || "" : "");
    var nAuth = document.getElementById("f_author").value.trim();
    var nEd = document.getElementById("f_edition").value.trim();
    var ci = parseInt(document.getElementById("modal").dataset.color || "0", 10);
    var id = t.dataset.id;
    if (pendingCover === "loading"){ flash("THE COVER IS STILL READING"); return; }
    if (id){
      var nn = nb(id);
      nn.title = title; nn.subtitle = sub; nn.author = nAuth; nn.edition = nEd; nn.color = COLORS[ci];
      if (pendingCover) nn.cover = pendingCover; else delete nn.cover;
    }
    else {
      var fresh = {id:uid(), title:title, subtitle:sub, author:nAuth, edition:nEd,
                   color:COLORS[ci], created:new Date().toISOString()};
      if (pendingCover) fresh.cover = pendingCover;
      db.notebooks.push(fresh); ui.view = "notebook"; ui.nbId = fresh.id; ui.kindFilter = "all";
    }
    pendingCover = null;
    save(); closeModal(); render(); return;
  }
  if (a === "delnb"){
    var n2 = nb(ui.nbId); if (!n2) return;
    var c = entriesOf(n2.id).length;
    if (!confirm("Discard “"+n2.title+"” and its "+c+" entr"+(c===1?"y":"ies")+"? This cannot be undone.")) return;
    db.entries = db.entries.filter(function(e){ return e.nbId !== n2.id; });
    db.notebooks = db.notebooks.filter(function(x){ return x.id !== n2.id; });
    ui.view = "shelf"; ui.nbId = null; save(); render(); return;
  }

  if (a === "newentry"){
    if (!db.notebooks.length){ notebookForm(null); return; }
    kindChooser(); return;
  }
  if (a === "pickkind"){ entryForm(null, t.dataset.k); return; }
  if (a === "edit"){ var e1 = entryById(t.dataset.id); if (e1) entryForm(e1); return; }

  if (a === "fmt"){
    var ffld = document.getElementById(t.dataset.target);
    if (ffld){
      if (t.dataset.fmt === "bold") toggleBold(ffld);
      else if (t.dataset.fmt === "dash") insertDash(ffld);
      else if (t.dataset.fmt === "indent") indentAt(ffld);
    }
    return;
  }

  if (a === "saveentry"){
    var k = document.getElementById("f_kind").value;
    var K = KINDS[k];
    var payload = {type:k, text:"", title:"", author:"", work:"", ref:"", page:""};
    K.fields.forEach(function(f){
      var el = document.getElementById("f_"+f);
      if (el) payload[f] = el.value.trim();
    });
    var primary = K.fields[0];
    if (!payload[primary]){
      var pe = document.getElementById("f_"+primary);
      if (pe) pe.focus();
      flash("THIS CANNOT BE EMPTY"); return;
    }
    payload.nbId = document.getElementById("f_nb").value;
    payload.note = document.getElementById("f_note").value.trim();
    var seen = {}, clean = [];
    document.getElementById("f_tags").value.split(",").map(function(s){ return s.trim(); })
      .filter(Boolean).forEach(function(x){
        var kk = x.toLowerCase(); if (!seen[kk]){ seen[kk] = 1; clean.push(x); }
      });
    payload.tags = clean;
    var eid = t.dataset.id;
    if (eid){
      var ex = entryById(eid);
      if (ex){ for (var key in payload) ex[key] = payload[key]; ex.updated = new Date().toISOString(); }
    } else {
      payload.id = uid(); payload.starred = false; payload.created = new Date().toISOString();
      db.entries.push(payload);
    }
    save(); closeModal(); render(); return;
  }
  if (a === "del"){
    if (!confirm("Delete this entry? This cannot be undone.")) return;
    db.entries = db.entries.filter(function(x){ return x.id !== t.dataset.id; });
    save(); render(); return;
  }
  if (a === "star"){
    var e3 = entryById(t.dataset.id);
    if (e3){ e3.starred = !e3.starred; save(true); render(); }
    return;
  }
  if (a === "copy"){ var e4 = entryById(t.dataset.id); if (e4) copyEntry(e4); return; }
  if (a === "kind"){ ui.kindFilter = t.dataset.k; render(); return; }
  if (a === "head"){
    if (ui.view === "notebook" && !ui.q){
      ui.filter = (ui.filter && ui.filter.toLowerCase() === t.dataset.t.toLowerCase()) ? null : t.dataset.t;
      render();
    }
    else { setQ(t.dataset.t); ui.kindFilter = "all"; render(); }
    window.scrollTo(0,0); return;
  }
  if (a === "unfilter"){ ui.filter = null; render(); return; }
  if (a === "lookup"){ setQ(t.dataset.t); ui.kindFilter = "all"; render(); window.scrollTo(0,0); return; }
  if (a === "jump"){
    var e5 = entryById(t.dataset.id); if (!e5) return;
    ui.view = "notebook"; ui.nbId = e5.nbId; ui.filter = null; ui.kindFilter = "all"; setQ(""); render();
    var el = document.getElementById("e-"+e5.id);
    if (el && el.scrollIntoView) el.scrollIntoView({block:"center", behavior:"smooth"});
    return;
  }
});

/* pressing a format button shouldn't pull the caret out of the field */
document.addEventListener("mousedown", function(ev){
  if (ev.target.closest && ev.target.closest('[data-act="fmt"]')) ev.preventDefault();
});
/* two hyphens become an em dash as you write */
var _dashGuard = false;
document.addEventListener("input", function(ev){
  if (_dashGuard) return;
  var el = ev.target;
  if (!el || el.tagName !== "TEXTAREA" || !el.id || el.id.indexOf("f_") !== 0) return;
  var c = el.selectionStart;
  if (c >= 2 && el.value.slice(c-2, c) === "--" && el.value.charAt(c-3) !== "-"){
    _dashGuard = true;
    replaceIn(el, c-2, c, "\u2014", c-1, c-1);
    _dashGuard = false;
  }
});

document.addEventListener("change", function(ev){
  if (ev.target.id === "backdropfile"){
    var bf = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!bf) return;
    if (bf.size > 40 * 1024 * 1024){ alert("That file is over 40 MB. Try a smaller one."); return; }
    var prev = document.getElementById("b_prev");
    if (prev) prev.innerHTML = '<span>READING…</span>';
    fileToCover(bf, 1500, 0.66).then(function(dataUrl){
      db.backdrop = dataUrl;
      if (!db.veil) db.veil = "medium";
      applyBackdrop(); save(); menuSheet(); flash("BACKDROP SET");
    }).catch(function(err){
      if (prev) prev.innerHTML = '<span>NONE</span>';
      if (err && err.message === "network"){
        alert("The PDF reader could not be loaded — it needs a connection the first time. You can choose an image instead.");
      } else {
        alert("That file could not be read as a backdrop. Try a JPG or PNG.");
      }
    });
    return;
  }
  if (ev.target.id === "coverfile"){
    var f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    if (f.size > 30 * 1024 * 1024){ alert("That file is over 30 MB. Try a smaller one."); return; }
    pendingCover = "loading"; refreshCoverPrev();
    fileToCover(f).then(function(dataUrl){
      pendingCover = dataUrl; refreshCoverPrev();
    }).catch(function(err){
      pendingCover = null; refreshCoverPrev();
      if (err && err.message === "network"){
        alert("The PDF reader could not be loaded — it needs a connection the first time. You can choose an image of the cover instead.");
      } else if (err && err.message === "image"){
        alert("That image could not be read. Try a JPG or PNG.");
      } else {
        alert("That file could not be read as a cover. Try a different PDF or an image.");
      }
    });
    return;
  }
  var s = ev.target.closest("[data-act='sort']");
  if (s){ ui.sort = s.value; render(); return; }
  var kk = ev.target.closest("[data-act='switchkind']");
  if (kk){
    /* keep whatever has been typed, then redraw the form for the new kind */
    var carry = {tags:[], note:""};
    ["text","title","author","work","ref","page"].forEach(function(f){
      var el = document.getElementById("f_"+f);
      if (el) carry[f] = el.value;
    });
    var tagsEl = document.getElementById("f_tags"), noteEl = document.getElementById("f_note");
    carry.tags = tagsEl ? tagsEl.value.split(",").map(function(x){ return x.trim(); }).filter(Boolean) : [];
    carry.note = noteEl ? noteEl.value : "";
    var idAttr = document.querySelector("[data-act='saveentry']").dataset.id;
    var nbSel = document.getElementById("f_nb").value;
    if (idAttr){
      var ex = entryById(idAttr);
      var merged = {}; for (var p in ex) merged[p] = ex[p];
      for (var c in carry) merged[c] = carry[c];
      merged.nbId = nbSel;
      entryForm(merged, kk.value);
      document.querySelector("[data-act='saveentry']").dataset.id = idAttr;
    } else {
      var was = ui.nbId; ui.nbId = nbSel;
      entryForm({text:carry.text||"",title:carry.title||"",author:carry.author||"",work:carry.work||"",
                 ref:carry.ref||"",page:carry.page||"",note:carry.note,tags:carry.tags}, kk.value);
      ui.nbId = was;
    }
  }
  /* changing which work an entry belongs to redraws the "from" line */
  var ns = ev.target.closest("[data-act='switchnb']");
  if (ns){
    var idA = document.querySelector("[data-act='saveentry']").dataset.id;
    var kNow = document.getElementById("f_kind").value;
    var keep = {tags:[], note:"", nbId:ns.value};
    ["text","title","author","work","ref","page"].forEach(function(f){
      var el = document.getElementById("f_"+f);
      if (el) keep[f] = el.value;
    });
    var tE = document.getElementById("f_tags"), nE = document.getElementById("f_note");
    keep.tags = tE ? tE.value.split(",").map(function(x){ return x.trim(); }).filter(Boolean) : [];
    keep.note = nE ? nE.value : "";
    var prev = ui.nbId; ui.nbId = ns.value;
    if (idA){
      var exN = entryById(idA), mg = {};
      for (var pp in exN) mg[pp] = exN[pp];
      for (var cc in keep) mg[cc] = keep[cc];
      entryForm(mg, kNow);
      document.querySelector("[data-act='saveentry']").dataset.id = idA;
    } else {
      entryForm(keep, kNow);
    }
    ui.nbId = prev;
  }
});

function setQ(v){
  ui.q = v;
  var input = document.getElementById("q");
  input.value = v;
  document.getElementById("searchwrap").classList.toggle("has", !!v);
}
document.getElementById("q").addEventListener("input", function(){
  ui.q = this.value.trim();
  document.getElementById("searchwrap").classList.toggle("has", !!this.value);
  render();
});
document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape"){
    if (document.getElementById("modal").innerHTML){ closeModal(); return; }
    if (ui.q){ setQ(""); render(); }
    return;
  }
  if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && (ev.key === "b" || ev.key === "B")){
    var fld = document.activeElement;
    if (fld && fld.id && fld.id.indexOf("f_") === 0 &&
        (fld.tagName === "TEXTAREA" || (fld.tagName === "INPUT" && fld.type === "text"))){
      ev.preventDefault(); toggleBold(fld); return;
    }
  }
  if (ev.key === "Tab" && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
    var tfld = document.activeElement;
    if (tfld && tfld.tagName === "TEXTAREA" && tfld.id && tfld.id.indexOf("f_") === 0){
      ev.preventDefault();
      if (ev.shiftKey) outdentAt(tfld); else indentAt(tfld);
      return;
    }
  }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (typing) return;
  if (ev.key === "/"){ ev.preventDefault(); document.getElementById("q").focus(); }
  if (!db.notebooks.length || document.getElementById("modal").innerHTML) return;
  var inNotebook = ui.view === "notebook" && !ui.q && nb(ui.nbId);
  if (ev.key === "n"){
    ev.preventDefault();
    if (inNotebook) entryForm(null, "passage"); else kindChooser();
  }
  if (ev.key === "r" && inNotebook){ ev.preventDefault(); entryForm(null, "reflection"); }
});

load();
})();
</script>
<script>
/* Installed-app plumbing. Deliberately placed after the app script, so the
   archives the book writes carry the fonts but not this. */
(function(){
  if (location.protocol !== "http:" && location.protocol !== "https:") return;
  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
  /* Ask the browser to treat this book as permanent rather than cache it
     may sweep. Silent either way; the app's own warnings still apply. */
  if (navigator.storage && navigator.storage.persist){
    navigator.storage.persisted().then(function(already){
      if (!already) return navigator.storage.persist();
    }).catch(function(){});
  }
})();
</script>
